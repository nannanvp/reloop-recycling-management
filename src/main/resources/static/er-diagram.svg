<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">ReLoop entity relationship diagram</title><desc id="desc">Eight normalized Oracle tables: centres, users, materials, pickups, pickup items, batches, reward ledger and audit log. Lines show one to many relations.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183c30}.title{font-size:28px;font-weight:700}.sub{font-size:13px;fill:#6d8276}.head{fill:#153e32}.headtext{fill:white;font-size:15px;font-weight:700}.row{font-size:12px}.key{font-weight:700;fill:#21634b}.edge{stroke:#819c8d;stroke-width:2;fill:none}.label{font-size:11px;fill:#4c6857}.box{fill:white;stroke:#cbdad0;stroke-width:1.5}.bg{fill:#f5f6f0}</style>
<rect class="bg" width="1120" height="790"/><text class="title" x="38" y="42">ReLoop · Entity relationships</text><text class="sub" x="39" y="65">PK = primary key · FK = foreign key · 1 ─ ∞ = one to many</text>
<g class="edge"><path d="M155 240 V260"/><path d="M253 179 H291 V378 H340"/><path d="M253 326 H305 V428 H340"/><path d="M253 130 H290 V84 H611 V163 H630"/><path d="M535 163 H630"/><path d="M535 394 H630"/><path d="M426 485 V580"/><path d="M485 250 H576 V625 H535"/><path d="M708 250 V538 H566 V655 H535"/><path d="M535 694 H812 V575 H842"/></g>
<g class="label"><text x="163" y="255">1 ─ ∞</text><text x="296" y="370">1 ─ ∞</text><text x="310" y="418">1 ─ ∞</text><text x="544" y="152">1 ─ ∞</text><text x="547" y="383">1 ─ ∞</text><text x="430" y="531">1 ─ ∞</text><text x="580" y="606">1 ─ ∞</text><text x="710" y="533">1 ─ ∞</text><text x="813" y="564">1 ─ ∞</text></g>
<g transform="translate(38 105)"><rect class="box" width="215" height="135" rx="10"/><path class="head" d="M10 0H205Q215 0 215 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_CENTRES</text><text class="row key" x="15" y="56">PK id</text><text class="row" x="15" y="77">name · address</text><text class="row" x="15" y="98">active</text></g>
<g transform="translate(38 260)"><rect class="box" width="215" height="155" rx="10"/><path class="head" d="M10 0H205Q215 0 215 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_USERS</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK centre_id</text><text class="row" x="15" y="98">full_name · email</text><text class="row" x="15" y="119">role · password_hash · active</text></g>
<g transform="translate(340 105)"><rect class="box" width="195" height="145" rx="10"/><path class="head" d="M10 0H185Q195 0 195 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_MATERIALS</text><text class="row key" x="15" y="56">PK id</text><text class="row" x="15" y="77">name · points_per_kg</text><text class="row" x="15" y="98">active</text></g>
<g transform="translate(340 343)"><rect class="box" width="195" height="142" rx="10"/><path class="head" d="M10 0H185Q195 0 195 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_PICKUPS</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK citizen_id · centre_id</text><text class="row" x="15" y="98">address · dates · status</text><text class="row" x="15" y="119">notes · timestamps</text></g>
<g transform="translate(340 580)"><rect class="box" width="195" height="160" rx="10"/><path class="head" d="M10 0H185Q195 0 195 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_PICKUP_ITEMS</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK pickup_id · material_id</text><text class="row key" x="15" y="98">FK batch_id (nullable)</text><text class="row" x="15" y="119">estimated / collected /</text><text class="row" x="15" y="139">accepted kg</text></g>
<g transform="translate(630 105)"><rect class="box" width="158" height="145" rx="10"/><path class="head" d="M10 0H148Q158 0 158 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_BATCHES</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK centre_id · material_id</text><text class="row key" x="15" y="98">FK processed_by</text><text class="row" x="15" y="119">output_kg · time</text></g>
<g transform="translate(630 343)"><rect class="box" width="158" height="145" rx="10"/><path class="head" d="M10 0H148Q158 0 158 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_AUDIT_LOG</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK pickup_id</text><text class="row" x="15" y="98">old / new status</text><text class="row" x="15" y="119">actor · timestamp</text></g>
<g transform="translate(842 505)"><rect class="box" width="240" height="145" rx="10"/><path class="head" d="M10 0H230Q240 0 240 10V35H0V10Q0 0 10 0"/><text class="headtext" x="15" y="24">RC_REWARD_LEDGER</text><text class="row key" x="15" y="56">PK id</text><text class="row key" x="15" y="77">FK pickup_item_id (unique)</text><text class="row key" x="15" y="98">FK posted_by</text><text class="row" x="15" y="119">rate snapshot · points · time</text></g>
<text class="sub" x="39" y="775">Historical snapshots: pickup address and awarded rate remain as recorded at the time of action.</text>
</svg>
